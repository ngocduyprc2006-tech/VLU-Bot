<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="vlu-icon" rel="icon" type="image/png" href="../img/logovanlang.png">
    <title>VLU Chatbot - Quản lý hệ thống Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="adminstyle.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-top-content">
                <div class="admin-brand">
                    <img src="../img/logovanlang.png" alt="Logo VLU">
                </div>
                <p class="admin-menu-title">Bảng điều khiển</p>
                <button class="admin-nav-btn active">
                    <i class="fas fa-sliders-h"></i> Cấu hình Prompt AI
                </button>
                <button class="admin-nav-btn" onclick="alert('Tính năng thống kê logs database đang được tích hợp nâng cao!')">
                    <i class="fas fa-database"></i> Nhật ký hội thoại
                </button>
            </div>
            <div class="sidebar-bottom-content">
                <button class="admin-nav-btn back-home-btn" onclick="location.href='../index.html'">
                    <i class="fas fa-arrow-left"></i> Quay lại Chatbot
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Hệ thống quản lý chuyên gia AI</h1>
                <div class="admin-user-info" style="font-size: 14px; color: var(--accent-orange);">
                    <i class="fas fa-user-shield"></i> Quyền Admin: Võ Ngọc Duy
                </div>
            </header>

            <section class="analytics-grid">
                <div class="analytics-card">
                    <div class="card-icon"><i class="fas fa-robot"></i></div>
                    <div class="card-info">
                        <p>Số lượng chuyên gia AI</p>
                        <h3>5 Module</h3>
                    </div>
                </div>
                <div class="analytics-card">
                    <div class="card-icon" style="background-color: rgba(80, 250, 123, 0.1); color: #50fa7b;"><i class="fas fa-comments"></i></div>
                    <div class="card-info">
                        <p>Trạng thái hệ thống</p>
                        <h3 style="color: #50fa7b; font-size: 18px;">Đang hoạt động</h3>
                    </div>
                </div>
            </section>

            <section class="prompt-config-section">
                <h2><i class="fas fa-edit" style="color: var(--accent-orange); margin-right: 8px;"></i>Tùy chỉnh câu lệnh hệ thống (System Prompt)</h2>
                <form id="adminPromptForm">
                    <div class="form-group">
                        <label for="prompt-default">1. Trợ lý ảo mặc định (Giao diện chính)</label>
                        <textarea id="prompt-default" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prompt-roadmap">2. Chuyên gia tư vấn Lộ trình học tập</label>
                        <textarea id="prompt-roadmap" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prompt-results">3. Chuyên gia phân tích Kết quả học tập (GPA)</label>
                        <textarea id="prompt-results" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prompt-graduation">4. Cố vấn xét Điều kiện tốt nghiệp</label>
                        <textarea id="prompt-graduation" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prompt-future">5. Chuyên gia Định hướng tương lai & Nghề nghiệp</label>
                        <textarea id="prompt-future" rows="3"></textarea>
                    </div>

                    <div class="save-btn-container">
                        <button type="submit" class="vlu-save-btn">
                            <i class="fas fa-save"></i> Cập nhật cấu hình hệ thống
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC03anG1UFwBR1752-JGNHyOtQtDcyx1co",
            authDomain: "vlu---bot.firebaseapp.com",
            projectId: "vlu---bot",
            storageBucket: "vlu---bot.firebasestorage.app",
            messagingSenderId: "869970228305",
            appId: "1:869970228305:web:c1bc57cf4982f4c811b470",
            measurementId: "G-FCW5JT8K0T"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    </script>

    <script src="adminscript.js"></script>
</body>

</html>
